<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>...</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <!-- พื้นที่แสดงคำถาม / ข้อความ -->
        <h1 id="question-text" class="fade-text"></h1>

        <!-- ส่วนของกล้อง (คำถามที่ 3) -->
        <div id="camera-container" class="camera-box" style="display: none;">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="canvas" style="display: none;"></canvas>
            <div class="camera-controls">
                <button id="switch-btn" class="btn btn-secondary" onclick="switchCamera()">🔄 Switch</button>
                <button id="capture-btn" class="btn btn-choice" onclick="takePicture()">📷 Capture</button>
            </div>
        </div>

        <!-- ปุ่มตัวเลือก Yes / No -->
        <div id="choice-buttons" class="button-group" style="display: none;">
            <button class="btn btn-choice" onclick="handleAnswer(true)">Yes</button>
            <button class="btn btn-choice" onclick="handleAnswer(false)">No</button>
        </div>

        <!-- ปุ่มสำหรับการรีเซ็ต / จบเกม -->
        <button id="action-btn" class="btn btn-action" style="display: none;"></button>
    </div>

    <script src="script.js"></script>
</body>
</html>

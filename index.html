<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>...</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <!-- อิโมจิอยู่กลางจอ -->
        <div id="emoji" class="emoji">😀</div>

        <!-- โซนคำถาม/ข้อความเตือน -->
        <div id="text-container" class="text-container">
            <h1 id="message-text" class="message-text"></h1>
            
            <!-- ปุ่มตัวเลือกคำถาม Yes/No -->
            <div id="question-buttons" class="button-group" style="display: none;">
                <button class="btn btn-choice" onclick="answerQuestion(true)">Yes</button>
                <button class="btn btn-choice" onclick="answerQuestion(false)">No</button>
            </div>

            <!-- ปุ่ม Return / Try Again -->
            <button id="action-btn" class="btn btn-action" style="display: none;" onclick="resetAndStart()">Return</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
